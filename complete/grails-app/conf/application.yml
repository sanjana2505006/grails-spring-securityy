info:
  app:
    name: '@info.app.name@'
    version: '@info.app.version@'
    grailsVersion: '@info.app.grailsVersion@'
dataSource:
  driverClassName: org.postgresql.Driver
  username: postgres
  password: ''
  pooled: true
  jmxExport: true
environments:
  development:
    dataSource:
      dbCreate: create-drop
      url: jdbc:postgresql://localhost:5432/devDb?tcpKeepAlive=true
  test:
    dataSource:
      dbCreate: create-drop
      url: jdbc:postgresql://localhost:5432/testDb?tcpKeepAlive=true
  production:
    dataSource:
      dbCreate: none
      url: jdbc:postgresql://localhost:5432/postgres?tcpKeepAlive=true
hibernate:
  cache:
    queries: false
    use_second_level_cache: false
    use_query_cache: false
grails:
  codegen:
    defaultPackage: example
  profile: rest-api
  mime:
    disable:
      accept:
        header:
          userAgents:
          - Gecko
          - WebKit
          - Presto
          - Trident
    types:
      json:
      - application/json
      - text/json
      hal:
      - application/hal+json
      - application/hal+xml
      xml:
      - text/xml
      - application/xml
      atom: application/atom+xml
      css: text/css
      csv: text/csv
      js: text/javascript
      rss: application/rss+xml
      text: text/plain
      all: '*/*'
  views:
    default:
      codec: html
  plugin:
    springsecurity:
      useBasicAuth: true
      basic:
        realmName: Securing Grails Applications
      rejectIfNoRule: true
      userLookup:
        userDomainClassName: example.User
        authorityJoinClassName: example.UserRole
      authority:
        className: example.Role
      controllerAnnotations:
        staticRules:
          - { pattern: '/', access: ['permitAll'] }
          - { pattern: '/error', access: ['permitAll'] }
          - { pattern: '/notFound', access: ['permitAll'] }
          - { pattern: '/shutdown', access: ['permitAll'] }
          - { pattern: '/assets/**', access: ['permitAll'] }
          - { pattern: '/**/favicon.ico', access: ['permitAll'] }
